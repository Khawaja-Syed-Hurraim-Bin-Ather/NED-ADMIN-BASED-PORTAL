# FYP Recommender Configuration
topics:
  - final-year-project
  - fyp
  - capstone-project
  - student-project

filters:
  min_stars: 4
  max_months_since_update: 36
  allow_forks: true
  exclude_archived: true
  require_readme: true

limits:
  fetch_per_topic: 50  # reasonable initial fetch count to prevent rate limit starvation
  display_page_size: 10
  display_max_results: 50

